name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile to run
        required: true
        default: full
        type: choice
        options:
          - fast
          - full

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.inputs.profile || 'auto' }}
  cancel-in-progress: true

jobs:
  fast:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.profile == 'fast' || github.event.inputs.profile == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Repository checks
        run: .agentic-template/bin/project check
      - name: README check
        run: .agentic-template/bin/project check-readme
      - name: Unit tests
        run: .agentic-template/bin/project test
      - name: Component tests
        run: .agentic-template/bin/project component-test
      - name: Integration tests
        run: .agentic-template/bin/project integration-test
      - name: Architecture lint
        run: .agentic-template/bin/project lint

  full-readiness:
    # Gates pull requests as well as main. It used to run only after a merge, which meant its
    # extra coverage - check-wiki, check-changes, compose-config, the not-applicable declarations -
    # found problems on main rather than on the branch that introduced them. Two of those checks
    # caught real defects during CHG-024 that a post-merge run would have reported too late.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'full') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Full readiness
        run: .agentic-template/bin/project ready
